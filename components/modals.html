<!-- Modal de Registro -->
<div class="modal fade" id="registroModal" tabindex="-1" aria-labelledby="registroModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header modal-purple border-0">
                <h5 class="modal-title fw-bold" id="registroModalLabel">
                    <i class="bi bi-person-plus me-2"></i>Crear Cuenta
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form id="formRegistro">
                    <div class="mb-3">
                        <label for="regNombre" class="form-label fw-semibold small">Nombre completo</label>
                        <input type="text" class="form-control" id="regNombre" placeholder="Juan Pérez" required>
                    </div>
                    <div class="mb-3">
                        <label for="regEmail" class="form-label fw-semibold small">Email</label>
                        <input type="email" class="form-control" id="regEmail" placeholder="juan@email.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="regPassword" class="form-label fw-semibold small">Contraseña</label>
                        <input type="password" class="form-control" id="regPassword" placeholder="Mínimo 6 caracteres" required minlength="6">
                    </div>
                    <div class="mb-3">
                        <label for="regPassword2" class="form-label fw-semibold small">Confirmar contraseña</label>
                        <input type="password" class="form-control" id="regPassword2" placeholder="Repite tu contraseña" required>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="regTerminos" required>
                        <label class="form-check-label small" for="regTerminos">
                            Acepto los <a href="#" class="text-purple">términos y condiciones</a>
                        </label>
                    </div>
                    <button type="submit" class="btn btn-purple w-100 fw-bold py-2">
                        <i class="bi bi-check-circle me-2"></i>Registrarme
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Modal de Compra / Carrito -->
<div class="modal fade" id="compraModal" tabindex="-1" aria-labelledby="compraModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header modal-blue border-0">
                <h5 class="modal-title fw-bold" id="compraModalLabel">
                    <i class="bi bi-cart-check me-2"></i>Tu Carrito
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <div id="listaCarrito">
                    <p class="text-center text-muted py-4"><i class="bi bi-cart-x fs-1 d-block mb-2"></i>Tu carrito está vacío</p>
                </div>
                <hr>
                <div class="d-flex justify-content-between align-items-center">
                    <h6 class="fw-bold mb-0">Total:</h6>
                    <h5 class="fw-bold text-purple mb-0" id="totalCarrito">$0.00</h5>
                </div>
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-outline-danger btn-sm" onclick="vaciarCarrito()">
                    <i class="bi bi-trash me-1"></i>Vaciar
                </button>
                <button type="button" class="btn btn-primary-custom" onclick="finalizarCompra()">
                    <i class="bi bi-credit-card me-1"></i>Finalizar Compra
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toastNotificacion" class="toast align-items-center text-bg-success border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body fw-bold" id="toastMensaje">
                Producto agregado al carrito
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<!-- Modal Vista de Producto -->
<div class="modal fade" id="productoModal" tabindex="-1" aria-labelledby="productoModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <button type="button" class="btn-close position-absolute top-0 end-0 m-3 z-3" data-bs-dismiss="modal" aria-label="Close"></button>
            <div class="modal-body p-0">
                <div class="row g-0">
                    <!-- Imagen del producto -->
                    <div class="col-md-6">
                        <div class="product-modal-img" id="productoModalImg">
                            <i class="bi bi-box"></i>
                        </div>
                    </div>
                    <!-- Info del producto -->
                    <div class="col-md-6">
                        <div class="product-modal-info">
                            <span class="section-badge mb-2" id="productoModalBadge">PRODUCT</span>
                            <h3 class="fw-bold mb-2" id="productoModalNombre">Nombre del producto</h3>
                            <p class="text-muted mb-3" id="productoModalDesc">Descripción del producto</p>
                            
                            <div class="d-flex align-items-center gap-3 mb-4">
                                <span class="product-modal-price" id="productoModalPrecio">$0.00</span>
                                <span class="product-modal-old-price d-none" id="productoModalPrecioOld"></span>
                            </div>

                            <!-- Cantidad -->
                            <div class="mb-4">
                                <label class="form-label fw-semibold small text-uppercase text-muted">Cantidad</label>
                                <div class="quantity-selector">
                                    <button class="qty-btn" onclick="cambiarCantidadModal(-1)">
                                        <i class="bi bi-dash"></i>
                                    </button>
                                    <span class="qty-value" id="modalCantidad">1</span>
                                    <button class="qty-btn" onclick="cambiarCantidadModal(1)">
                                        <i class="bi bi-plus"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Botones -->
                            <div class="d-flex flex-column gap-2">
                                <button class="btn btn-primary-custom w-100 py-2" id="btnAgregarModal" onclick="agregarDesdeModal()">
                                    <i class="bi bi-cart-plus me-2"></i>Add to Cart
                                </button>
                                <button class="btn btn-outline-custom w-100 py-2" onclick="comprarAhoraModal()">
                                    <i class="bi bi-lightning-fill me-2"></i>Buy Now
                                </button>
                            </div>

                            <!-- Extras -->
                            <div class="product-modal-extras mt-4">
                                <div class="d-flex align-items-center gap-2 mb-2">
                                    <i class="bi bi-truck text-muted"></i>
                                    <span class="small text-muted">Envío gratis en pedidos +$50</span>
                                </div>
                                <div class="d-flex align-items-center gap-2 mb-2">
                                    <i class="bi bi-shield-check text-muted"></i>
                                    <span class="small text-muted">Garantía de 12 meses</span>
                                </div>
                                <div class="d-flex align-items-center gap-2">
                                    <i class="bi bi-arrow-return-left text-muted"></i>
                                    <span class="small text-muted">Devolución gratuita en 30 días</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

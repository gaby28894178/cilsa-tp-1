<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - ShopColor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Page Header -->
    <section class="page-header">
        <div class="container">
            <nav class="breadcrumb-custom mb-2">
                <a href="../index.html">Home</a> <span class="mx-2 opacity-50">/</span> <span class="active">Shop</span>
            </nav>
            <span class="section-badge">COLLECTION</span>
            <h1>Digital Pulse</h1>
            <p>Precision-engineered tools for the high-velocity modern life.</p>
        </div>
    </section>

    <!-- Productos con sidebar -->
    <section class="py-5">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-2 col-md-3 d-none d-md-block">
                    <p class="categories-title">Categories</p>
                    <ul class="categories-list" id="categories-list">
                        <li><a href="#" class="active" data-category="all">All</a></li>
                    </ul>
                </div>
                <div class="col-lg-10 col-md-9">
                    <div class="row g-3" id="grid-productos"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Modals -->
    <div id="modals-container"></div>

    <!-- Chat Button -->
    <button class="chat-btn" title="Chat con nosotros">
        <i class="bi bi-envelope-fill"></i>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/carrito.js"></script>
    <script src="../js/productos.js"></script>
</body>
</html>

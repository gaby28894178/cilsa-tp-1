<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - ShopColor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>

    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Contact Section -->
    <section class="contact-section py-5">
        <div class="container">
            <div class="row align-items-start g-5">
                <!-- Left: Info -->
                <div class="col-lg-5">
                    <span class="contact-badge">
                        <i class="bi bi-envelope-fill"></i> GET IN TOUCH
                    </span>
                    <h1 class="contact-title">Let's start a conversation.</h1>
                    <p class="contact-text">Have a question about our collections or need help with an order? Our team is ready to pulse with energy.</p>

                    <div class="contact-info-item">
                        <div class="icon-circle">
                            <i class="bi bi-envelope-fill"></i>
                        </div>
                        <div>
                            <p class="info-label mb-0">EMAIL US</p>
                            <p class="info-value mb-0">hello@shopcolor.com</p>
                        </div>
                    </div>

                    <div class="contact-info-item">
                        <div class="icon-circle">
                            <i class="bi bi-telephone-fill"></i>
                        </div>
                        <div>
                            <p class="info-label mb-0">CALL US</p>
                            <p class="info-value mb-0">+1 234 567 890</p>
                        </div>
                    </div>

                    <div class="contact-info-item">
                        <div class="icon-circle">
                            <i class="bi bi-geo-alt-fill"></i>
                        </div>
                        <div>
                            <p class="info-label mb-0">VISIT US</p>
                            <p class="info-value mb-0">Calle Principal #123, Ciudad</p>
                        </div>
                    </div>
                </div>

                <!-- Right: Form -->
                <div class="col-lg-7">
                    <div class="contact-form-card">
                        <form id="formContacto">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="nombre">FULL NAME</label>
                                    <input type="text" class="form-control" id="nombre" placeholder="John Doe" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="email">EMAIL ADDRESS</label>
                                    <input type="email" class="form-control" id="email" placeholder="john@example.com" required>
                                </div>
                                <div class="col-12">
                                    <label for="mensaje">YOUR MESSAGE</label>
                                    <textarea class="form-control" id="mensaje" rows="6" placeholder="How can we help?" required></textarea>
                                </div>
                                <div class="col-12">
                                    <button type="submit" class="btn btn-send">
                                        Send Message <i class="bi bi-send ms-2"></i>
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Modals -->
    <div id="modals-container"></div>

    <!-- Chat Button -->
    <button class="chat-btn" title="Chat con nosotros">
        <i class="bi bi-envelope-fill"></i>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/carrito.js"></script>
    <script>
        document.getElementById('formContacto').addEventListener('submit', function(e) {
            e.preventDefault();
            mostrarToast('📨 Message sent! We\'ll get back to you soon', 'success');
            this.reset();
        });
    </script>
</body>
</html>
